name: Kakeibo audited ledger-only production release (one shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/kakeibo-ledger-audit-release-20261117.yml]
permissions:
  contents: read
concurrency:
  group: four-app-coordinated-production-release
  cancel-in-progress: false
jobs:
  pages-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAKEIBO_BASE: f30a10ae36561c316e2ffb832a9ba29a29e43da2
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed HomeFlow contract
        uses: actions/checkout@v4
        with:
          repository: PTamako/homeflow
          ref: 86f00f411d954a1e236c546590c20e0afac9656b
          path: .contract-homeflow
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify only one reviewed workflow was added after audited code
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$KAKEIBO_BASE" HEAD
          git diff --name-only "$KAKEIBO_BASE" HEAD | grep -v -Fx '.github/workflows/kakeibo-ledger-audit-release-20261117.yml' > /tmp/unreviewed.txt || true
          test ! -s /tmp/unreviewed.txt || { echo "::error::Unreviewed app code present"; cat /tmp/unreviewed.txt; exit 1; }
          test "$(git -C .contract-homeflow rev-parse HEAD)" = "86f00f411d954a1e236c546590c20e0afac9656b"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies and run complete audit regression, production build and security audit
        run: |
          npm ci --no-audit --no-fund
          npm run verify:release
      - name: Verify production HomeFlow contract, Pages secrets, bindings and D1 integrity (read only)
        id: preflight
        run: |
          node --input-type=module <<'JS'
          import {appendFile} from 'node:fs/promises'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID
          const token=process.env.CLOUDFLARE_API_TOKEN
          const url='https://api.cloudflare.com/client/v4/accounts/'+account
          const api=async(path,method='GET',body)=>{
            const r=await fetch(url+path,{method,headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})})
            if(!r.ok)throw Error('Cloudflare HTTP '+r.status+' at '+path)
            if(path.endsWith('/content/v2'))return r.text()
            const data=await r.json();if(data.success!==true)throw Error('Cloudflare unsuccessful at '+path)
            return data.result
          }
          const p=await api('/pages/projects/kakeibo')
          const existing=p.canonical_deployment
          if(!existing?.id||existing.environment!=='production'||existing.latest_stage?.status!=='success')
            throw Error('Previous canonical Pages release is not a successful production deployment')
          if(p.source?.config?.production_deployments_enabled!==false||
             p.source?.config?.preview_deployment_setting!=='none')
            throw Error('Unexpected Pages auto/Preview deployment policy drift')
          const prod=p.deployment_configs?.production
          const env=prod?.env_vars||{}
          const required=['APP_ENV','KAKEIBO_FAMILY_FINANCE_ENABLED','KAKEIBO_SHARED_MUTATION_APPROVAL_ENABLED',
            'KAKEIBO_SHARED_MUTATION_SUBMISSION_SECRET','KAKEIBO_FAMILY_PENDING_KEY','KAKEIBO_SSO_ENCRYPTION_KEY']
          if(required.some(k=>!env[k]))throw Error('Production Pages identity or approval binding missing')
          if(prod?.d1_databases?.DB?.id!=='4d790915-fc06-4073-b660-bbb51dc74463'||
             prod?.r2_buckets?.RECEIPTS_R2?.name!=='kakeibo-receipts'||
             prod?.services?.HOMEFLOW_IDENTITY_SERVICE?.service!=='homeflow')
            throw Error('D1, private R2 or HomeFlow service binding drift')
          const workers=await api('/workers/scripts/homeflow/deployments')
          const current=workers.deployments?.[0]?.versions?.find(x=>x.percentage===100)?.version_id
          if(!current)throw Error('No active HomeFlow Worker at 100%')
          const h=await api('/workers/scripts/homeflow/content/v2')
          if(!h.includes('recurring_plan_owner_review_retired')||
             !h.includes('Only changes to the shared household ledger require owner approval.'))
            throw Error('Live HomeFlow Worker does not contain the reviewed approval-only contract')
          const d=await api('/d1/database/4d790915-fc06-4073-b660-bbb51dc74463/query','POST',
             {sql:"PRAGMA quick_check"})
          const checked=Array.isArray(d)?d[0]?.results?.[0]?.quick_check:d?.results?.[0]?.quick_check
          if(checked!=='ok')throw Error('Production kakeibo D1 quick_check did not return ok')
          await appendFile(process.env.GITHUB_ENV,'PAGES_ROLLBACK_ID='+existing.id+'\nHOMEFLOW_REVIEWED_VERSION='+current+'\n')
          console.log('PREFLIGHT_OK: production D1, R2, HomeFlow and previous rollback verified')
          JS
      - name: Recheck active HomeFlow version and deploy only existing Pages production
        id: deploy
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID
          const auth={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}
          const r=await fetch(root+'/workers/scripts/homeflow/deployments',{headers:auth})
          if(!r.ok)throw Error('Unable to recheck HomeFlow active version')
          const data=await r.json()
          const now=data.result?.deployments?.[0]?.versions?.find(x=>x.percentage===100)?.version_id
          if(now!==process.env.HOMEFLOW_REVIEWED_VERSION)throw Error('HomeFlow changed during coordinated release')
          JS
          npx wrangler pages deploy dist --project-name=kakeibo --branch=main --commit-hash="$GITHUB_SHA"
      - name: Independently verify live canonical Pages deployment and app shell
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID
          const auth={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}
          const sleep=n=>new Promise(resolve=>setTimeout(resolve,n))
          let verified=false,observed=''
          for(let attempt=0;attempt<24;attempt++){
            const r=await fetch(root+'/pages/projects/kakeibo',{headers:auth,cache:'no-store'})
            if(!r.ok)throw Error('Unable to verify deployment: HTTP '+r.status)
            const obj=await r.json(),p=obj.result,canonical=p?.canonical_deployment
            observed=(canonical?.deployment_trigger?.metadata?.commit_hash||'')+' '+(canonical?.latest_stage?.status||'unknown')
            if(canonical?.deployment_trigger?.metadata?.commit_hash===process.env.GITHUB_SHA&&
               canonical?.latest_stage?.status==='success'&&canonical.environment==='production'&&
               p.source?.config?.preview_deployment_setting==='none'){
              const site=await fetch('https://kakeibo-f17.pages.dev/?_audit='+process.env.GITHUB_SHA,{cache:'no-store'})
              const html=await site.text()
              const asset=html.match(/(?:src|href)="(\/assets\/[^"]+\.js)"/)
              if(site.ok&&asset){
                const js=await fetch('https://kakeibo-f17.pages.dev'+asset[1],{cache:'no-store'})
                const body=await js.text()
                if(js.ok&&body.includes('member-receipts')&&body.includes('HomeFlow')){
                  verified=true;break
                }
              }
            }
            await sleep(2500)
          }
          if(!verified)throw Error('New canonical Pages production or mobile app asset not verified: '+observed)
          console.log('PRODUCTION_VERIFIED: Pages canonical is new tested commit and app shell matches reviewed code')
          JS
      - name: Roll back Pages if deploy or verification fails
        if: ${{ failure() && steps.preflight.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN
          const id=process.env.PAGES_ROLLBACK_ID
          if(!id)throw Error('No verified pre-release rollback deployment id')
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/kakeibo'
          const r=await fetch(root+'/deployments/'+id+'/rollback',{
             method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:'{}'})
          if(!r.ok)throw Error('Pages rollback API failed HTTP '+r.status)
          const result=await r.json();if(!result.success)throw Error('Pages rollback result unconfirmed')
          console.log('ROLLBACK_REQUESTED: previous production version restored')
          JS
