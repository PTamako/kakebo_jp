name: One-shot production D1 spouse transfer schema 0068
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kakeibo-spouse-transfer-0068-once.yml'
permissions:
  contents: read
concurrency:
  group: kakeibo-production-schema-0068
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned feature and protected production configuration
        run: |
          git merge-base --is-ancestor abcd475b3619c4eb94642d2e6aceb91ebbed1540 HEAD
          grep -q "database_id = \"4d790915-fc06-4073-b660-bbb51dc74463\"" wrangler.toml
          test -f migrations/0068_neutral_spouse_transfer.sql
          grep -q "family_legacy_shared_adoptions" migrations/0068_neutral_spouse_transfer.sql
      - name: Run all finance regressions and production build
        run: |
          npm ci
          npm run verify:release
      - name: Verify Cloudflare API access and capture Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "fb4f558f6c71bd0e7f1c6a0734bf6171"
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/4d790915-fc06-4073-b660-bbb51dc74463"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$root/time_travel/bookmark" > /tmp/kakeibo-before-bookmark.json
          node -e "const d=require('/tmp/kakeibo-before-bookmark.json'); if(!d.success||!d.result?.bookmark)process.exit(1)"
          echo "Cloudflare Time Travel recovery bookmark captured. No preview resources."
      - name: Strict production D1 schema preflight and immutable baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/4d790915-fc06-4073-b660-bbb51dc74463"
          curl -fsS -X POST "$root/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"sql":"SELECT name,sql FROM sqlite_master WHERE type=\u0027trigger\u0027 AND name IN (\u0027trg_shared_entry_registry_guard\u0027,\u0027trg_shared_entry_registry_transition\u0027,\u0027trg_shared_mutation_applied_guard\u0027); SELECT COUNT(*) AS n FROM entries; SELECT COUNT(*) AS n FROM schema_migrations WHERE version=\u0027schema-0068-neutral-spouse-transfer\u0027;"}' > /tmp/kakeibo-0068-before.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/kakeibo-0068-before.json'))
          if(!x.success||x.result?.length!==3)throw Error('D1 baseline query incomplete')
          const tr=x.result[0]?.results||[],count=x.result[1]?.results?.[0]?.n,installed=x.result[2]?.results?.[0]?.n
          if(tr.length!==3||tr.some(t=>!t.sql?.includes('family_legacy_shared_adoptions')))throw Error('Protected adopted legacy guards have drifted')
          if(installed!==0)throw Error('0068 already applied: one-shot deployment must not run twice')
          if(!Number.isSafeInteger(count)||count<0)throw Error('Cannot verify entry count')
          fs.writeFileSync('/tmp/kakeibo-0068-entry-count',String(count))
          console.log('Read-only D1 baseline verified. Existing entries:',count)
          NODE
      - name: Apply exactly one versioned migration to existing production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute kakeibo --remote --file migrations/0068_neutral_spouse_transfer.sql --config wrangler.toml --yes
      - name: Verify existing entries untouched and all three guards preserved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/4d790915-fc06-4073-b660-bbb51dc74463"
          curl -fsS -X POST "$root/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"sql":"SELECT name,sql FROM sqlite_master WHERE type=\u0027trigger\u0027 AND name IN (\u0027trg_shared_entry_registry_guard\u0027,\u0027trg_shared_entry_registry_transition\u0027,\u0027trg_shared_mutation_applied_guard\u0027); SELECT COUNT(*) AS n FROM entries; SELECT COUNT(*) AS n FROM schema_migrations WHERE version=\u0027schema-0068-neutral-spouse-transfer\u0027;"}' > /tmp/kakeibo-0068-after.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/kakeibo-0068-after.json'))
          if(!x.success||x.result?.length!==3)throw Error('D1 postflight incomplete')
          const tr=x.result[0]?.results||[],count=x.result[1]?.results?.[0]?.n,installed=x.result[2]?.results?.[0]?.n
          if(tr.length!==3||tr.some(t=>!t.sql?.includes('family_legacy_shared_adoptions')||!t.sql?.includes("transfer_target='spouse'")))throw Error('0068 guards not fully installed')
          if(installed!==1)throw Error('0068 migration receipt missing')
          const previous=Number(fs.readFileSync('/tmp/kakeibo-0068-entry-count','utf8'))
          if(count!==previous)throw Error('Entry count changed during schema release; reconcile before Pages deployment')
          console.log('MIGRATION_0068_SUCCESS; all protected guards and household entry count unchanged:',count)
          NODE
