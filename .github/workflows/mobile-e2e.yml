name: Mobile WebKit Smoke
on:
  pull_request:
    paths:
      - 'src/**'
      - 'functions/api/**'
      - 'public/**'
      - 'vite.config.js'
      - 'scripts/mobile-browser-smoke.mjs'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:
jobs:
  mobile-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node scripts/mobile-browser-smoke.mjs
