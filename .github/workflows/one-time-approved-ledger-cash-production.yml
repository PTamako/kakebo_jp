name: One-time Payment Ownership and Stats Production Publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approved-ledger-cash-production.yml'
permissions:
  contents: read
concurrency:
  group: deploy-private-kakeibo-bridge
  cancel-in-progress: false
jobs:
  production:
    if: "${{ startsWith(github.event.head_commit.message, 'deploy(kakeibo): publish payment ownership stats release') }}"
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require scoped production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare API token unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account unavailable"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - name: Run full release tests and build
        run: npm run verify:release
      - name: Deploy existing private bridge with signed reviewed ledger handlers
        run: npx wrangler deploy --config wrangler.homeflow-bridge.toml
      - name: Publish existing Pages project on main (production only)
        run: npx wrangler pages deploy dist --project-name=kakeibo --branch=main --commit-hash="$GITHUB_SHA" --commit-message="payment ownership read-only and family payment statistics release"
      - name: Confirm production Pages endpoint responds
        run: curl --retry 5 --retry-delay 3 --fail --silent --show-error https://kakeibo-f17.pages.dev/ >/dev/null
