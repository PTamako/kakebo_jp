name: One-time Ledger-only Kakeibo Production Publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-ledger-only-pages-production.yml'
permissions:
  contents: read
jobs:
  production:
    if: "${{ startsWith(github.event.head_commit.message, 'deploy(kakeibo): publish ledger-only release') }}"
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare API token unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account unavailable"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - name: Validate release and production bundle
        run: npm run verify:release
      - name: Explicit deploy to original Pages production project only
        run: npx wrangler pages deploy dist --project-name=kakeibo --branch=main --commit-hash="$GITHUB_SHA" --commit-message="ledger-only finance release"
      - name: Confirm public Pages endpoint responds
        run: |
          curl --retry 5 --retry-delay 3 --fail --silent --show-error https://kakeibo-f17.pages.dev/ >/dev/null
