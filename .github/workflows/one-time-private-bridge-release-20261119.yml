name: One-Time Private Kakeibo Bridge Production Release 2026-11-19
# This workflow runs only when first created on main, then is removed.
# Does not create preview or change existing D1/Worker secrets.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-private-bridge-release-20261119.yml'
permissions:
  contents: read
concurrency:
  group: deploy-private-kakeibo-bridge
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify production build and tests
        run: npm run verify:release
      - name: Validate production credential availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy existing private Worker to its existing D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.homeflow-bridge.toml
