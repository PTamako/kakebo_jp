name: PR 114 temporary test diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture test failures for temporary PR diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test:parse > test-output.log 2>&1
          RESULT=$?
          cat test-output.log
          if [ "$RESULT" != "0" ]; then
            {
              echo "Temporary diagnostic (test:parse failed):"
              echo '~~~'
              grep -E -A 15 'not ok |✖|failure|ERR_ASSERTION|AssertionError|Error:' test-output.log | tail -c 13000 || true
              echo '~~~'
            } > /tmp/pr114-diagnostic-comment.txt
            gh pr comment 114 --body-file /tmp/pr114-diagnostic-comment.txt || true
          fi
          exit "$RESULT"
      - name: Build
        run: npm run build
