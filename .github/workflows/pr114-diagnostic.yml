name: PR114 temporary diagnostic push
on:
  push:
    branches: [refactor/stop-runtime-legacy-backfill-20261029]
    paths-ignore:
      - 'test-logs/**'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Capture output
        run: |
          set +e
          npm ci > /tmp/install.log 2>&1
          INSTALL=$?
          if [ "$INSTALL" -eq 0 ]; then
            npm run test:parse > /tmp/tests.log 2>&1
            RESULT=$?
          else
            RESULT="$INSTALL"
            echo "npm ci failed" > /tmp/tests.log
          fi
          mkdir -p test-logs
          { echo "Install exit: $INSTALL; test exit: $RESULT"; tail -n 40 /tmp/install.log; echo '=== Test output ==='; tail -n 180 /tmp/tests.log; } > test-logs/pr114-debug.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-logs/pr114-debug.log
          git commit -m 'chore: temporary test diagnostics [skip ci]' || true
          git push origin HEAD:refs/heads/refactor/stop-runtime-legacy-backfill-20261029 || true
          exit "$RESULT"
