name: Validate
# Validate category-to-details navigation and shared-list pagination as part of the production build
# Actions quota is exhausted. Cloudflare Pages runs npm run build, which
# executes npm run test:parse before Vite. Keep this workflow for manual use
# after Actions minutes become available, without automatic quota-consuming runs.
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tests, production build and production dependency advisories
        run: npm run verify:release
      - name: Report all dependency advisories (non-blocking dev dependency inventory)
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
