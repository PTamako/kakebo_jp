name: Validate
# Validate category-to-details navigation and shared-list pagination as part of the production build
# Actions quota is exhausted. Cloudflare Pages runs npm run build, which
# executes npm run test:parse before Vite. Keep this workflow for manual use
# after Actions minutes become available, without automatic quota-consuming runs.
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report dependency audit
        run: |
          npm audit || true
          npm audit --omit=dev || true
      - name: Run complete parsing and API integrity regression suite
        run: npm run test:parse
      - run: npm run build
