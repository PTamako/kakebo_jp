# Private Cloudflare Service Binding target. No public route and no cron.
# Reused for signed JPDA requests; HomeFlow GET path remains read-only.
# Deploy: npx wrangler deploy --config wrangler.homeflow-bridge.toml
# HomeFlow binds this Worker as KAKEBO_LEDGER_SERVICE; kakebo Pages stays separate.
name = "kakeibo-homeflow-bridge"
main = "workers/homeflow-service-bridge.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[vars]
JPDA_BRIDGE_ENABLED = "true"
JPDA_PRIVATE_BRIDGE = "true"
APP_ENV = "production"
HOMEFLOW_OAUTH_ORIGIN = "https://homeflow.yupan6706.workers.dev"
# JPDA_BRIDGE_SECRET is managed as a Cloudflare secret, never in Git.

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"

# Signed HomeFlow approval and immutable D1 receipt proofs only.
[[services]]
binding = "HOMEFLOW_IDENTITY_SERVICE"
service = "homeflow"

# Verify signed document source once; do not trust document IDs from the caller.
[[services]]
binding = "DOCUMENT_FINANCE_SOURCE_SERVICE"
service = "jp-document-assistant"
