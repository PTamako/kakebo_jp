# Separate scheduled Worker; this does not replace Pages wrangler.toml.
# Workers Builds production deploy: npx wrangler deploy --config wrangler.nav.toml
# Keep the repository root wrangler.toml for Pages; never rename it to this Worker.
# Daily 21:00 JST (12:00 UTC). Daiwa optional retry suspended after official HTTP 403.
name = "kakeibo-nav-sync"
main = "workers/fund-nav-cron.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["0 12 * * *"]

# Experimental official Daiwa CSV discovery was blocked by HTTP 403 on 2026-10-30.
# Keep the reader dormant until an authorized, stable source is verified.
[vars]
DAIWA_CSV_EXPERIMENT = "false"

# Preserve every once-daily scheduled invocation and its console messages.
# Workers Logs are separate from Workers Builds deployment logs.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"
