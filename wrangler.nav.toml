# Separate scheduled Worker; this does not replace Pages wrangler.toml.
# Workers Builds production deploy: npx wrangler deploy --config wrangler.nav.toml
# Keep the repository root wrangler.toml for Pages; never rename it to this Worker.
# One existing Worker, two daily triggers:
# 00:30 JST: recurring/SBI primary plus prior trading-day NAV retry.
# 19:30 JST: NAV primary plus idempotent recurring/SBI catch-up.
name = "kakeibo-nav-sync"
main = "workers/fund-nav-cron.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["30 15 * * *", "30 10 * * *"]

# Daiwa official website currently rejects automated access (HTTP 403).
# Disable the experimental CSV fetch until an authorized public feed becomes available.
[vars]
DAIWA_CSV_EXPERIMENT = "false"
HEARTBEAT_ENABLED = "true"

# Log both daily invocations; NAV and financial job outcomes remain independent.
# Workers Logs are separate from Workers Builds deployment logs.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"

# Worker Previews are isolated: this is NEVER the production D1.
# Preview Worker has no cron trigger; heartbeat recording is disabled.
[previews.vars]
DAIWA_CSV_EXPERIMENT = "false"
HEARTBEAT_ENABLED = "false"

[[previews.d1_databases]]
binding = "DB"
database_name = "kakebo_preview"
database_id = "b1c73b65-9530-468a-b9a3-49554f8a9264"
