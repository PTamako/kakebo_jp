name = "kakeibo"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"   # 既存の本番 D1 ID。運用環境では変更しないでください。

[ai]
binding = "AI"

# Pages Git integration reads this file as the source of truth. Do not rely on
# dashboard-only Preview overrides: preview builds can reset those bindings.
# Production above keeps the existing real D1; preview always uses test D1.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "kakebo_preview"
database_id = "b1c73b65-9530-468a-b9a3-49554f8a9264"

[env.preview.ai]
binding = "AI"

[env.preview.vars]
APP_ENV = "preview"
PREVIEW_D1_ISOLATED = "true"
PREVIEW_D1_ID = "b1c73b65-9530-468a-b9a3-49554f8a9264"
PRODUCTION_D1_ID = "4d790915-fc06-4073-b660-bbb51dc74463"

# The preview DB contains a matching environment_identity record and NO
# production ledger. Set AUTH_TOKEN separately as a Preview-only secret to use
# read-only QA; do not copy production credentials. Until then API fails closed.
