name = "kakeibo"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"   # 既存の本番 D1 ID。運用環境では変更しないでください。

[ai]
binding = "AI"

# Private receipt images (never a public R2 domain).
[[r2_buckets]]
binding = "RECEIPTS_R2"
bucket_name = "kakeibo-receipts"

# Pages Git integration reads this file as the source of truth.
# Cloudflare Pages automatic Preview builds are disabled. Preview has no D1
# or R2 bindings; never point previews at the production finance database.
# Re-enable only after provisioning and reviewing a NEW isolated test D1.
[env.preview.ai]
binding = "AI"

[env.preview.vars]
APP_ENV = "preview"
