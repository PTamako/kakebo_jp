name = "kakeibo"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"   # 既存の本番 D1 ID。運用環境では変更しないでください。

[ai]
binding = "AI"

# Private receipt images (never a public R2 domain).
[[r2_buckets]]
binding = "RECEIPTS_R2"
bucket_name = "kakeibo-receipts"

# Production identity is the existing HomeFlow Worker. No new preview resources.
[[services]]
binding = "HOMEFLOW_IDENTITY_SERVICE"
service = "homeflow"

[vars]
KAKEIBO_HOMEFLOW_SSO_ENABLED = "true"
KAKEIBO_FAMILY_FINANCE_ENABLED = "true"
KAKEIBO_APPROVAL_SUBMISSION_ENABLED = "true"
KAKEIBO_APPROVAL_PROOF_ENABLED = "true"
KAKEIBO_SHARED_ENTRY_ENABLED = "true"
KAKEIBO_SHARED_MUTATION_APPROVAL_ENABLED = "true"
KAKEIBO_BANK_TRANSFER_ENABLED = "true"
KAKEIBO_CROSS_MEMBER_BANK_ENABLED = "true"
KAKEIBO_CARD_PURCHASES_ENABLED = "true"
KAKEIBO_CARD_SETTLEMENTS_ENABLED = "true"
KAKEIBO_PREPAID_ACTIONS_ENABLED = "true"
KAKEIBO_POINTS_ACTIONS_ENABLED = "true"
KAKEIBO_SBI_CASH_ENABLED = "true"
KAKEIBO_RECURRING_FINANCE_PLANS_ENABLED = "true"
KAKEIBO_RECURRING_POLICY_SUBMISSION_ENABLED = "true"
KAKEIBO_LEGACY_SHARED_ADOPTION_ENABLED = "true"
KAKEIBO_LEGACY_SHARED_ADOPTION_PREFLIGHT_ENABLED = "true"
KAKEIBO_LEGACY_SHARED_RECEIPT_COPY_ENABLED = "true"
KAKEIBO_LEGACY_SHARED_SOURCE_REFCOUNT_ENABLED = "true"
KAKEIBO_LEGACY_SHARED_RECEIPT_REPAIR_ENABLED = "true"

APP_ENV = "production"
HOMEFLOW_OAUTH_ORIGIN = "https://homeflow.yupan6706.workers.dev"
KAKEIBO_PUBLIC_ORIGIN = "https://kakeibo-f17.pages.dev"

# Pages Git integration reads this file as the source of truth.
# Cloudflare Pages automatic Preview builds are disabled. Preview has no D1
# or R2 bindings; never point previews at the production finance database.
# Re-enable only after provisioning and reviewing a NEW isolated test D1.
[env.preview.ai]
binding = "AI"

[env.preview.vars]
APP_ENV = "preview"
