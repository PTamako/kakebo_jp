name = "kakeibo"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "4d790915-fc06-4073-b660-bbb51dc74463"   # ← 换成你的 D1 ID

[ai]
binding = "AI"

# Fail closed by default: a preview must NOT touch the live D1 ledger.
# Set PREVIEW_D1_ISOLATED=true only after a distinct preview DB is VERIFIED
# in Cloudflare Pages Settings > Bindings. Preview financial writes stay blocked.
[env.preview.vars]
APP_ENV = "preview"
